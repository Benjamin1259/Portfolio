<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube Transcript Keywords — Settings</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", Arial, sans-serif;
        max-width: 480px;
        margin: 32px auto;
        color: #1f1f1f;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 16px;
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        margin-top: 16px;
        background: #065fd4;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #0b57a4;
      }
      p.hint {
        color: #555;
        font-size: 12.5px;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
      }
      a {
        color: #065fd4;
      }
    </style>
  </head>
  <body>
    <h1>YouTube Transcript Keywords</h1>
    <p class="hint">
      This extension calls the Gemini API directly with your own API key — nothing is sent to any
      server besides Google's. Get a free key at
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.
    </p>

    <label for="apiKey">Gemini API key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="AIza..." />

    <label for="model">Gemini model</label>
    <select id="model">
      <option value="gemini-3.6-flash">gemini-3.6-flash (fast, recommended)</option>
      <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview (higher quality, preview model)</option>
    </select>

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
